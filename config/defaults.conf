# LulzBot KlipperScreen Default Configuration File
# We know the KlipperScreen devs say DO NOT EDIT THIS FILE USE KlipperScreen.conf
# but we need to be able to edit menus and settings for LulzBot printers as
# part of our custom KlipperScreen builds.

[main]
font_size = large

[preheat PLA]
bed = 60
extruder = 180

[preheat ABS]
bed = 95
extruder = 220

[preheat TPU]
bed = 60
extruder = 200

[preheat Cold Pull]
extruder = 145

[include main_menu.conf]
[include splash_menu.conf]
[include print_menu.conf]
[include move_menu.conf]
