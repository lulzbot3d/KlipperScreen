# LulzBot KlipperScreen Configuration File
# We know the KlipperScreen devs say DO NOT EDIT THIS FILE USE KlipperScreen.conf
# but we need to be able to edit menus and settings for LulzBot printers as
# part of our custom KlipperScreen builds.
# Note, the includes from mainline are not used here.

[menu __splashscreen]
name: {{ gettext('Menu') }}

[menu __splashscreen power]
name: {{ gettext('Power') }}
icon: shutdown
panel: power
enable: {{ moonraker.power_devices.count > 0 }}

[menu __splashscreen network]
name: {{ gettext('Network') }}
icon: network
panel: network

[menu __splashscreen updater]
name: {{ gettext('Update') }}
icon: refresh
panel: updater
enable: {{ moonraker_connected }}

[menu __splashscreen settings]
name: KlipperScreen
icon: settings
panel: settings

[menu __splashscreen system]
name: {{ gettext('System') }}
icon: info
panel: system
enable: {{ moonraker_connected }}
